<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="丸投げ倉庫">
<meta name="theme-color" content="#1f2a36">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>丸投げ倉庫</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f5f7; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .msg { font: 15px/1.8 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #1d2430; padding: 24px; }
  .msg a { color: #1f6fb2; }
  /* 通知の申し込み。出品ノートの操作を隠さないよう、右下に小さく出す */
  #bell { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
          z-index: 5; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px);
          font: 700 14px/1.4 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #bell button { border: 0; border-radius: 999px; padding: 11px 16px; background: #e8641b; color: #fff; font: inherit;
                 box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  #bell button.x { background: #3a4552; padding: 11px 13px; }
  #bell .st { background: #1f2a36; color: #fff; border-radius: 10px; padding: 9px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="bell" hidden></div>
<script>
/* 丸投げ倉庫の「スマホの出品ノート」を、Google の注意書きの帯なしで開くための入口。
 * 各自の出品ノートの住所（鍵つき）は「#」より後ろで受け取る。「#」より後ろはブラウザの外へ送られないので、
 * このページを置いている場所には、住所も鍵も届かない。
 * 開けるのは Google Apps Script の出品ノートだけ（ほかのサイトを埋め込ませない）。
 *
 * ホーム画面に追加して開くと、通知も受け取れる（iPhone は iOS 16.4 以降）。
 * 通知は家のパソコンの丸投げ倉庫が Apple・Google の通知の住所へ直接送る。このページの置き場は通らない。 */
(function () {
  var 形 = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec\?k=[0-9a-f]{20,64}(&n=\d{1,2})?$/;
  var 住所 = '';
  try { 住所 = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  // ホーム画面から開いたときに「#」が落ちていても開けるよう、この端末に覚えておく
  try {
    if (形.test(住所)) localStorage.setItem('kapi_note', 住所);
    else 住所 = localStorage.getItem('kapi_note') || '';
  } catch (e) {}
  if (!形.test(住所)) {
    document.body.innerHTML = '<div class="msg">丸投げ倉庫の設定画面「📱 スマホの出品ノート」の QRコードから開いてください。</div>';
    return;
  }
  var f = document.createElement('iframe');
  f.src = 住所;
  // 写真をまとめて保存（共有）と、文のコピーを中で使えるようにする
  f.allow = 'web-share; clipboard-write';
  f.title = '丸投げ倉庫 出品ノート';
  document.body.appendChild(f);

  通知の準備(住所);
})();

function 通知の準備(住所) {
  var ホーム画面 = (window.navigator.standalone === true) ||
                  (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  var 使える = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if (!使える) return;
  var 登録 = navigator.serviceWorker.register('sw.js');
  登録.catch(function () {});              // 登録できない環境では、出品ノートだけ使う
  var 鍵 = '', 箱 = document.getElementById('bell');
  var 鍵だけ = 住所.split('?k=')[1].split('&')[0], 受け口 = 住所.split('?')[0];

  // 出品ノート（中の Google のページ）が、家のパソコンの公開鍵を教えてくれる
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin) && e.origin !== 'https://script.google.com') return;
    var d = e.data || {};
    if (d.kapi !== 'push-key' || !/^[A-Za-z0-9_-]{80,100}$/.test(String(d.key || ''))) return;
    鍵 = d.key;
    様子を見る();
  });

  function 見せる(html) { 箱.innerHTML = html; 箱.hidden = !html; }
  function 済み(言葉) {
    見せる('<div class="st">' + 言葉 + '</div>');
    setTimeout(function () { 見せる(''); }, 4000);
  }

  function 様子を見る() {
    if (!ホーム画面) return;                      // iPhone はホーム画面から開いたときだけ通知を申し込める
    登録.then(function (r) { return r.pushManager.getSubscription(); }).then(function (今) {
      var 送った = 0;
      try { 送った = Number(localStorage.getItem('kapi_push_sent') || 0); } catch (e) {}
      if (今 && Notification.permission === 'granted') {
        // 受け口を貼り直したときなどに備えて、週に一度は登録を送り直す
        if (Date.now() - 送った > 7 * 864e5) 送る(今);
        return;
      }
      if (Notification.permission === 'denied') return;
      try { if (localStorage.getItem('kapi_push_later') === '1') return; } catch (e) {}
      見せる('<button type="button" id="bellOn">🔔 通知を受け取る</button><button type="button" class="x" id="bellLater" aria-label="あとで">×</button>');
      document.getElementById('bellOn').onclick = 申し込む;
      document.getElementById('bellLater').onclick = function () {
        try { localStorage.setItem('kapi_push_later', '1'); } catch (e) {}
        見せる('');
      };
    });
  }

  function 申し込む() {
    Notification.requestPermission().then(function (答え) {
      if (答え !== 'granted') { 済み('通知は止めたままです。iPhone の「設定」→「通知」から変えられます'); return; }
      return 登録.then(function (r) {
        var 生 = atob(鍵.replace(/-/g, '+').replace(/_/g, '/'));
        var 鍵の形 = new Uint8Array(生.length);
        for (var i = 0; i < 生.length; i++) 鍵の形[i] = 生.charCodeAt(i);
        return r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: 鍵の形 });
      }).then(function (s) { return 送る(s); }).then(function () {
        済み('通知を受け取ります。パソコンの丸投げ倉庫の設定から試しに送れます');
      });
    }).catch(function () { 済み('通知を申し込めませんでした。少し待ってからもう一度押してください'); });
  }

  // 申し込みを、自分の管理表の受け口へ預ける（答えは読めない送り方なので、届いたかはパソコンで確かめる）
  function 送る(s) {
    return fetch(受け口, {
      method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'push-sub', k: 鍵だけ, sub: s.toJSON(), 端末: navigator.platform || '' }),
    }).then(function () {
      try { localStorage.setItem('kapi_push_sent', String(Date.now())); } catch (e) {}
    });
  }
}
</script>
</body>
</html>
